<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>우리 아이 진로 사주</title></head><body><title>우리 아이 진로 사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 열(최대 480px), 종이 카드 위에 장(章)이 이어지는 리포트 북 */
:root{
 --paper:#F3F6F4; --card:#FFFFFF; --ink:#1D2B36; --muted:#5E6E78; --line:#DCE5E1;
 --teal:#22786E; --mint:#DDF1EC; --mint-ink:#1B5F57; --gold:#C9952B; --gold-bg:#FBF2DC; --red:#C2503D;
 --e-mok:#3E8E4F; --e-hwa:#D0533F; --e-to:#B98A2E; --e-geum:#7F8A93; --e-su:#2F4E7A;
 --display:"Gowun Batang","Nanum Myeongjo",serif; --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#121A1F; --card:#1A252C; --ink:#E7EEF0; --muted:#9AABB3; --line:#2B3A42;
 --teal:#5CC2B3; --mint:#173A36; --mint-ink:#9BE3D6; --gold:#E2B456; --gold-bg:#3A3020; --red:#E57B67;
 --e-mok:#6CC07E; --e-hwa:#F07A66; --e-to:#DDB45A; --e-geum:#AEB8C0; --e-su:#7FA3D8; color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#121A1F; --card:#1A252C; --ink:#E7EEF0; --muted:#9AABB3; --line:#2B3A42;
 --teal:#5CC2B3; --mint:#173A36; --mint-ink:#9BE3D6; --gold:#E2B456; --gold-bg:#3A3020; --red:#E57B67;
 --e-mok:#6CC07E; --e-hwa:#F07A66; --e-to:#DDB45A; --e-geum:#AEB8C0; --e-su:#7FA3D8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:8px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-block:10px;font-size:13px;color:var(--muted)}
.hdr b{font-family:var(--display);color:var(--ink);font-size:15px}
.hero{padding-block:18px 8px;display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--teal);font-weight:700}
.hero h1{font-size:30px}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero .sub{color:var(--muted)}
.hero .h1sub{font-family:var(--display);font-size:19px;color:var(--gold);font-weight:700;margin:-4px 0 0}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price s{color:var(--muted);font-size:14px}
.price b{font-size:22px;color:var(--red);font-family:var(--display)}
.price s{text-decoration-thickness:2px}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paybtns.one{grid-template-columns:1fr}
.paybtns button{padding:14px 8px;border:2px solid var(--line);border-radius:12px;background:var(--paper);font-size:15px;font-weight:700;color:var(--ink)}
.paybtns button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint);color:var(--mint-ink)}
.dpay{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:#FF6F0F;color:#fff;font-size:13px;font-weight:700}
.paybtns #pmD[aria-pressed="true"]{border-color:#FF6F0F;background:#FFF1E6;color:#C24E00}
.incl{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh-in{position:relative;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:shup .25s ease}
@keyframes shup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sh-hd{display:flex;justify-content:space-between;align-items:center}.sh-hd b{font-size:18px}
.sh-x{border:0;background:none;font-size:20px;color:var(--muted);padding:4px 8px}
.testbadge{background:var(--gold-bg);color:var(--gold);font-size:13px;font-weight:700;padding:8px 10px;border-radius:10px;text-align:center}
.sh-item{padding:12px;border-radius:12px;background:var(--paper)}.sh-item div{display:grid;gap:2px}.sh-item span{font-size:13px;color:var(--muted)}
.sh-sum{display:grid;gap:6px;font-size:14px}.sh-sum div{display:flex;justify-content:space-between}.sh-sum s{color:var(--muted)}.sh-sum em{font-style:normal;color:var(--red)}
.sh-sum .tot{border-top:1px solid var(--line);padding-top:8px;font-size:16px;font-weight:700}.sh-sum .tot b{color:var(--red);font-size:22px;font-family:var(--display)}
.sh-lab{font-size:14px;font-weight:700}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm button{display:flex;align-items:center;gap:8px;padding:13px 10px;border:2px solid var(--line);border-radius:12px;background:var(--paper);font-size:14px;font-weight:700;color:var(--ink);text-align:left}
.pm button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint);color:var(--mint-ink)}
.ic{width:18px;height:18px;border-radius:5px;flex:none}.ic-c{background:#4A6CF7}.ic-k{background:#FEE500}.ic-t{background:#0064FF}.ic-n{background:#03C75A}.ic-p{background:#8A94A6}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}.agree input{width:20px;height:20px;flex:none;margin-top:1px}
.btn:disabled{opacity:.45}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tg button,.tg1{border:1.5px solid var(--line,#dde5e3);background:var(--card,#fff);border-radius:14px;padding:10px 4px;display:grid;gap:2px;text-align:center;color:var(--ink,#1c2b33);font:inherit}
.tg button b{font-size:15px}.tg button span{font-size:11.5px;color:var(--muted)}
.tg1{width:100%;padding:13px;font-size:15px;font-weight:600}
.tg button[aria-pressed="true"],.tg1[aria-pressed="true"]{border-color:var(--teal,#217a6e);background:var(--mint,#dff3ee);box-shadow:0 0 0 1px var(--teal,#217a6e) inset}
.tg button[aria-pressed="true"] span{color:var(--teal,#217a6e)}
.gsteps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.5}
.gcode{display:grid;gap:8px;border-top:1px dashed var(--line,#ddd);padding-top:12px}
a.btn{text-align:center;text-decoration:none;display:block}
a.btn[aria-disabled="true"]{opacity:.5}
.paidnote{display:grid;gap:6px;padding:14px;border-radius:12px;background:var(--mint);color:var(--mint-ink);margin-block:8px}
.paidnote>*{min-width:0}.paidnote .order{word-break:break-all;background:var(--card)}
@media print{.paidnote,.sheet{display:none!important}}
.pghead{position:sticky;top:0;z-index:5;background:var(--paper);padding-block:6px 8px;display:grid;gap:6px}
.pgt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.pgt b{font-size:14px;color:var(--mint-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pgt span{font-size:13px;color:var(--muted);flex:none}
.pgbar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}.pgbar i{display:block;height:100%;background:var(--teal);transition:width .3s}
@media screen{
 html.paged,html.paged body{height:100%;height:var(--vh,100%);overflow:hidden}
 html.paged body{position:relative}
 html.paged .bar{position:absolute}
 html.paged #app{height:calc(100vh - 78px);height:calc(100dvh - 78px);height:calc(var(--vh,100dvh) - 78px);display:flex;flex-direction:column;padding-block:0}
 html.paged #pages{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 html.paged #pages::-webkit-scrollbar{display:none}
 html.paged .page{height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding-block:10px 24px;scrollbar-width:none}
 html.paged .page::-webkit-scrollbar{display:none}
 html.paged .hdr,html.paged .pghead{flex:none}
}
html.flow .page{padding-block:14px 26px;border-bottom:6px solid var(--line)}html.flow .page:last-child{border-bottom:0}html.flow .pghead{display:none}
.flowonly{display:none!important}html.flow .flowonly{display:block!important}
.scrollhint{text-align:center;color:var(--muted);font-size:13px;margin-top:18px;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(4px)}}
.pgno{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
@media print{.pgno{display:none}.page{min-height:0;border:0;padding:0}}
.bar .in.pn{grid-template-columns:1fr 2fr}
.paynext{display:grid;gap:6px;text-align:center;padding:18px 12px;margin-block:12px;border-radius:14px;background:var(--gold-bg);color:var(--ink)}.paynext b{font-size:18px}.paynext span{font-size:14px;color:var(--muted)}
@media print{.page[hidden]{display:block!important}.pghead{display:none!important}.page{animation:none}}
.paybox{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--paper);font-size:15px;line-height:1.6}
.paybox .amt{font-family:var(--display);font-size:26px;color:var(--red);font-weight:700}
.ordno{font-size:13px;color:var(--muted)}.ordno b{color:var(--ink);letter-spacing:.08em}
.done{display:grid;gap:8px;text-align:center;padding:20px 14px;border-radius:14px;background:var(--mint);color:var(--mint-ink)}
.done b{font-size:18px}
.price span{font-size:12px;background:var(--gold-bg);color:var(--gold);padding:2px 8px;border-radius:99px;font-weight:700}
.hooks{display:grid;gap:22px;padding-block:22px}
.hook h3{font-size:19px}
.hook h3 small{display:block;font-size:16px;font-weight:400;color:var(--muted);font-family:var(--body)}
.fake{filter:blur(4.5px);user-select:none;color:var(--muted);margin-top:8px;font-size:14px;line-height:1.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
form.card{display:grid;gap:14px}
form.fcompact{gap:8px;padding:12px 14px}form.fcompact h2{font-size:20px}
form.fcompact input,form.fcompact select{padding:10px}
form.fcompact .seg button{padding:10px 4px}
form.fcompact .btn{padding:12px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);border:0;padding:0}
.card h2{font-size:21px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:11px;border:0;background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:var(--mint);color:var(--mint-ink)}
.btn.gold{background:var(--gold);color:#fff}
.err{color:var(--red);font-size:13px}
.small{font-size:12px;color:var(--muted)}
.toc{display:grid;gap:26px;padding-block:28px}
.toc-h{text-align:center;display:grid;gap:4px}
.toc-h h2{font-size:24px}
.ch-no{font-size:13px;color:var(--teal);font-weight:700;display:flex;gap:6px;align-items:center}
.ch-no::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal)}
.chap h2{font-size:22px;margin-top:4px}
.items{list-style:none;padding:0;margin:12px 0 0;display:grid}
.items li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.items li b{color:var(--teal);font-size:12px;flex:none;padding-top:2px}
.more{margin-top:12px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--teal);background:var(--mint);color:var(--mint-ink);font-weight:700;font-size:14px}
/* 결과 */
.prof{display:grid;gap:14px}
.prof .kw{font-family:var(--display);font-size:22px}
.prof .kw small{display:block;font-family:var(--body);font-size:13px;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pil{display:grid;gap:4px;text-align:center}
.pl{font-size:11px;color:var(--muted)}
.gl{background:var(--paper);border-radius:10px;padding:6px 2px;display:grid;line-height:1.3}
.gl small{font-size:10px;color:var(--muted)}
.gl em{font-style:normal;font-size:10px;color:var(--muted)}
.ch{font-family:var(--display);font-size:26px;font-weight:700}
.e-목{color:var(--e-mok)}.e-화{color:var(--e-hwa)}.e-토{color:var(--e-to)}.e-금{color:var(--e-geum)}.e-수{color:var(--e-su)}
.bg-목{background:var(--e-mok)}.bg-화{background:var(--e-hwa)}.bg-토{background:var(--e-to)}.bg-금{background:var(--e-geum)}.bg-수{background:var(--e-su)}
.els{display:grid;gap:6px}
.elr{display:grid;grid-template-columns:44px 1fr 32px;gap:8px;align-items:center;font-size:13px}
.eln{font-weight:700}.eln i{font-style:normal;font-size:11px;margin-left:2px;opacity:.7}
.elb,.fb{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.elb b,.fb b{display:block;height:100%;border-radius:99px}
.fb b{background:var(--teal)}
.elc,.fs{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.fields{display:grid;gap:8px;margin-block:4px 12px}
.fr{display:grid;grid-template-columns:minmax(0,7.5em) 1fr 26px;gap:8px;align-items:center;font-size:13px}
.fr.top .fn{font-weight:700;color:var(--teal)}
.fr.top .fb b{background:var(--gold)}
.q{filter:blur(4px)}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat span{font-size:12px;background:var(--mint);color:var(--mint-ink);padding:4px 10px;border-radius:99px;font-weight:500}
.rchap{display:grid;gap:12px;padding-block:26px;border-bottom:1px dashed var(--line)}
.ritem{display:grid;gap:10px}
.ritem h3{font-size:17px;display:flex;gap:8px;align-items:baseline}
.ritem h3 b{font-family:var(--body);font-size:12px;color:var(--teal);flex:none}
.ritem p{color:var(--ink)}
.locked{position:relative}
.locked .fake{margin:0}
.lockcap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lockcap span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--mint-ink)}
.pl-list,.el-list{padding-left:18px;margin:0;display:grid;gap:8px;font-size:14px}
.pl-list span{color:var(--muted);font-size:12px}
.god{display:grid;gap:4px;padding:12px;background:var(--paper);border-radius:12px}
.god small{color:var(--muted);font-weight:400;font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{border:1px solid var(--teal);color:var(--mint-ink);border-radius:99px;padding:4px 12px;font-size:13px}
.scales{display:grid;gap:14px}
.scl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sct{position:relative;height:6px;background:var(--line);border-radius:99px;margin-top:4px}
.sct b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--teal);transform:translate(-50%,-50%);border:3px solid var(--card)}
.job{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.jh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jh b{font-size:16px}
.jr{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.tier{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}
.t1{background:var(--gold-bg);color:var(--gold)}.t2{background:var(--mint);color:var(--mint-ink)}.t3{background:var(--paper);color:var(--muted)}
.jm{font-size:13px;color:var(--muted)}.jm b{color:var(--ink);margin-right:4px}
.cau{display:grid;gap:2px;padding:12px;border-left:3px solid var(--gold);background:var(--gold-bg);border-radius:0 10px 10px 0}
.cau p{font-size:14px}
.work{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;font-weight:700}
.wt{height:12px;background:var(--gold);border-radius:99px;overflow:hidden}.wt b{display:block;height:100%;background:var(--teal)}
.wl{text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.yr{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.yh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.yh b{font-family:var(--display)}.yh span{font-size:12px;color:var(--teal);font-weight:700}
.yr p{font-size:14px}
.checks{display:grid;gap:6px}
.checks div{display:grid;grid-template-columns:3.5em 1fr;gap:8px;font-size:14px;padding:10px;background:var(--mint);border-radius:10px}
.checks b{color:var(--mint-ink)}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mo{display:grid;padding:8px;background:var(--paper);border-radius:10px;line-height:1.4}
.mo b{font-size:14px}.mo span{font-family:var(--display);font-size:12px;color:var(--muted)}.mo em{font-style:normal;font-size:12px}
.daeun{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.du{flex:none;width:56px;display:grid;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:10px;line-height:1.4}
.du em{font-style:normal;font-size:11px;color:var(--muted)}.du b{font-family:var(--display);font-size:16px}.du span{font-size:11px;color:var(--teal)}
.du.now{background:var(--teal);border-color:var(--teal)}.du.now *{color:#fff}
.dd{display:grid;gap:10px}
.dd>div{padding:12px;border-radius:12px;background:var(--paper)}
.dd ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.luck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.luck div{display:grid;text-align:center;padding:10px 4px;border-radius:10px;background:var(--mint)}
.luck em{font-style:normal;font-size:11px;color:var(--muted)}.luck b{font-size:13px;color:var(--mint-ink)}
/* 구매 */
.buy{display:grid;gap:14px;border:2px solid var(--teal)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:14px;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.order{font-size:13px;white-space:pre-wrap;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px;user-select:all}

<script>// ===== 사주 계산 엔진 (saju_engine.py 이식) =====
const STEMS="甲乙丙丁戊己庚辛壬癸",STEMS_KO="갑을병정무기경신임계";
const BR="子丑寅卯辰巳午未申酉戌亥",BR_KO="자축인묘진사오미신유술해";
const STEM_EL=["목","목","화","화","토","토","금","금","수","수"];
const BR_EL=["수","토","목","목","토","화","화","토","금","금","토","수"];
const ELS=["목","화","토","금","수"];
const EL_HJ={목:"木",화:"火",토:"土",금:"金",수:"水"};
const HIDDEN=["壬癸","癸辛己","戊丙甲","甲乙","乙癸戊","戊庚丙","丙己丁","丁乙己","戊壬庚","庚辛","辛丁戊","戊甲壬"];
const BR_MAIN=[9,5,0,1,4,2,3,5,6,7,4,8];
const D2R=Math.PI/180;
function sunLon(ms){
  const jd=ms/86400000+2440587.5+69/86400;
  const T=(jd-2451545)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*D2R;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*D2R;
  return (((L0+C-0.00569-0.00478*Math.sin(om))%360)+360)%360;
}
function findTerm(deg,aroundMs){
  let lo=aroundMs-40*864e5,hi=aroundMs+40*864e5;
  const diff=t=>((sunLon(t)-deg+180)%360+360)%360-180;
  for(let i=0;i<60;i++){const mid=lo+(hi-lo)/2;if(diff(mid)<0)lo=mid;else hi=mid;}
  return lo;
}
const mod=(a,n)=>((a%n)+n)%n;
function tenGod(d,o){
  const de=ELS.indexOf(STEM_EL[d]),oe=ELS.indexOf(STEM_EL[o]);
  const rel=mod(oe-de,5),same=d%2===o%2;
  return [["비견","겁재"],["식신","상관"],["편재","정재"],["편관","정관"],["편인","정인"]][rel][same?0:1];
}
// y,mo,d,h,mi: 한국 표준시 입력. corr: 경도 보정(분)
function computeSaju(y,mo,d,h,mi,gender,corr,hourKnown){
  if(!hourKnown){h=12;mi=0;}
  const ms=Date.UTC(y,mo-1,d,h-9,mi);
  const lon=sunLon(ms);
  const k=Math.floor(mod(lon-315,360)/30);
  const prevDeg=mod(315+30*k,360),nextDeg=mod(prevDeg+30,360);
  const back=mod(lon-prevDeg,360);
  const prevT=findTerm(prevDeg,ms-back*1.0146*864e5);
  const nextT=findTerm(nextDeg,ms+(30-back)*1.0146*864e5);
  const ipchun=findTerm(315,Date.UTC(y,1,4));
  const sy=ms>=ipchun?y:y-1;
  const ys=mod(sy-4,10),yb=mod(sy-4,12);
  const ms_=mod([2,4,6,8,0][ys%5]+k,10),mb=mod(2+k,12);
  // 일주: 보정된 지방시
  const loc=new Date(Date.UTC(y,mo-1,d,h,mi)+corr*60000);
  let jdn=Math.floor(Date.UTC(loc.getUTCFullYear(),loc.getUTCMonth(),loc.getUTCDate())/864e5)+2440588;
  if(loc.getUTCHours()===23)jdn+=1;
  const di=mod(jdn+49,60),ds=di%10,db=di%12;
  const hb=mod(Math.floor((loc.getUTCHours()+1)/2),12);
  const hs=mod([0,2,4,6,8][ds%5]+hb,10);
  const P={year:[ys,yb],month:[ms_,mb],day:[ds,db]};
  if(hourKnown)P.hour=[hs,hb];
  const count={},weighted={};ELS.forEach(e=>{count[e]=0;weighted[e]=0;});
  for(const key in P){const [s,b]=P[key];
    count[STEM_EL[s]]++;count[BR_EL[b]]++;weighted[STEM_EL[s]]+=1;
    const hid=HIDDEN[b],w=hid.length===2?[.3,.7]:[.2,.2,.6];
    [...hid].forEach((ch,i)=>{weighted[STEM_EL[STEMS.indexOf(ch)]]+=w[i]*(key==="month"?1.5:1);});}
  const gods={},godCount={};
  for(const key in P){const [s,b]=P[key];
    gods[key]={stem:key==="day"?"일간":tenGod(ds,s),branch:tenGod(ds,BR_MAIN[b])};
    for(const g of [gods[key].stem,gods[key].branch]) if(g!=="일간")godCount[g]=(godCount[g]||0)+1;}
  const de=ELS.indexOf(STEM_EL[ds]);
  const support=weighted[ELS[de]]+weighted[ELS[mod(de-1,5)]];
  const total=Object.values(weighted).reduce((a,b)=>a+b,0);
  const yang=ys%2===0,forward=(yang&&gender==="M")||(!yang&&gender==="F");
  const span=forward?nextT-ms:ms-prevT;
  const startAge=Math.max(1,Math.round(span/864e5/3));
  let mi60=0;for(let i=0;i<60;i++)if(i%10===ms_&&i%12===mb){mi60=i;break;}
  const daeun=[];
  for(let i=1;i<=8;i++){const idx=mod(forward?mi60+i:mi60-i,60),s=idx%10,b=idx%12;
    daeun.push({age:startAge+(i-1)*10,stem:s,branch:b,gs:tenGod(ds,s),gb:tenGod(ds,BR_MAIN[b])});}
  const seun=yr=>{const s=mod(yr-4,10),b=mod(yr-4,12);return{year:yr,stem:s,branch:b,gs:tenGod(ds,s),gb:tenGod(ds,BR_MAIN[b])};};
  return {P,gods,count,weighted,godCount,strength:support/total,ds,daeun,forward,startAge,seun,sy};
}

};

function jo(w,a,b){const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0)?a:b);}
function nickOf(name){
 name=(name||"").trim().replace(/[<>&"]/g,""); if(!name)return "우리 아이";
 const c=name.charCodeAt(name.length-1);
 if(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0)return name+"이";
 return name;
}
const fill=(s,a)=>s.replace(/\{a\}/g,a);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function analyze(inp){
 const r=computeSaju(inp.y,inp.m,inp.d,inp.h,inp.mi,inp.g,inp.corr,inp.hk);
 const dmEl=STEM_EL[r.ds],de=ELS.indexOf(dmEl);
 const relEl={same:ELS[de],output:ELS[(de+1)%5],wealth:ELS[(de+2)%5],officer:ELS[(de+3)%5],resource:ELS[(de+4)%5]};
 const gs={};for(const k in relEl)gs[k]=r.weighted[relEl[k]]-(k==="same"?1:0);
 // 실제 십성 개수 반영
 for(const g in r.godCount)gs[GRP_OF[g]]+=r.godCount[g]*.5;
 const gOrder=Object.keys(gs).sort((a,b)=>gs[b]-gs[a]);
 const elOrder=[...ELS].sort((a,b)=>r.weighted[b]-r.weighted[a]);
 const missing=ELS.filter(e=>r.count[e]===0);
 const strong=r.strength>=.5;
 const pool=strong?["output","wealth","officer"]:["resource","same"];
 const useful=relEl[pool.sort((a,b)=>r.weighted[relEl[a]]-r.weighted[relEl[b]])[0]];
 const totW=Object.values(r.weighted).reduce((a,b)=>a+b,0);
 const totG=Object.values(gs).reduce((a,b)=>a+Math.max(b,0),0)||1;
 const fRaw=FIELDS.map(f=>{let s=0;for(const e in f.el)s+=f.el[e]*r.weighted[e]/totW*5;
   for(const g in f.g)s+=f.g[g]*Math.max(gs[g],0)/totG*5;
   if(f.el[useful])s+=.4; return {...f,raw:s};});
 const mn=Math.min(...fRaw.map(f=>f.raw)),mx=Math.max(...fRaw.map(f=>f.raw));
 fRaw.forEach(f=>f.score=Math.round(58+(f.raw-mn)/((mx-mn)||1)*37));
 const fieldsSorted=[...fRaw].sort((a,b)=>b.score-a.score);
 const fScore=Object.fromEntries(fRaw.map(f=>[f.k,f.score]));
 const jobs=JOBS.map(j=>{let s=fScore[j.f]/20;
   j.el.forEach((e,i)=>s+=r.weighted[e]/totW*5*(i?0.6:1)+(e===useful?.5:0));
   j.g.forEach((g,i)=>s+=Math.max(gs[g],0)/totG*6*(i?0.6:1));
   return {...j,s};}).sort((a,b)=>b.s-a.s);
 const top=[],per={};for(const j of jobs){if((per[j.f]||0)>=2)continue;top.push(j);per[j.f]=(per[j.f]||0)+1;if(top.length===5)break;}
 const pc=k=>Math.max(gs[k],0)/totG;
 const scales=[
  ["혼자 집중하는 편","사람들과 어울리는 편",clamp(50+(pc("output")+pc("wealth")+pc("same")-pc("resource")*1.6)*45)],
  ["안정적인 환경","변화가 많은 환경",clamp(50+(pc("output")+pc("wealth")-pc("officer")-pc("resource"))*55)],
  ["깊이 생각한 뒤 움직임","먼저 움직이며 생각함",clamp(50+(pc("same")+pc("output")-pc("resource")*1.5)*50)],
  ["큰 그림을 봄","디테일을 챙김",clamp(50+(godPc(r,["정재","정관","정인","식신"])-godPc(r,["편재","편관","편인","상관"]))*60)]
 ];
 const job=pc("officer")+pc("resource"),biz=pc("wealth")+pc("output")+pc("same")*.7;
 const workPct=clamp(50+(job-biz)*60,15,85);
 const age=2026-inp.y+1;
 return {inp,r,nick:nickOf(inp.name),dm:DM[r.ds],dmEl,relEl,gs,gOrder,elOrder,missing,strong,useful,fieldsSorted,top,scales,workPct,age};
}
function clamp(v,lo=12,hi=88){return Math.round(Math.max(lo,Math.min(hi,v)));}
function godPc(r,list){let t=0,s=0;for(const g in r.godCount){t+=r.godCount[g];if(list.includes(g))s+=r.godCount[g];}return t?s/t:0;}

 btn.disabled=true;btn.textContent="결제창 여는 중…";

  PayApp.setParam("goodname",PAY.orderName);PayApp.setParam("price",String(PAY.amount));PayApp.setParam("recvphone",ph);
  PayApp.setParam("smsuse","n");PayApp.setParam("var1",orderId);PayApp.setParam("returnurl",back);
  (PayApp.call||PayApp.payrequest).call(PayApp);}
  catch(e){btn.disabled=false;btn.textContent=`${PRICE} 결제하기`;payErr("결제창을 열지 못했어요. 잠시 후 다시 시도해 주세요.");}};
 if(window.PayApp)go();else{const sc=document.createElement("script");sc.src="https://lite.payapp.kr/public/api/v2/payapp-lite.js";sc.onload=go;sc.onerror=()=>{btn.disabled=false;btn.textContent=`${PRICE} 결제하기`;payErr("결제창을 불러오지 못했어요.");};document.head.appendChild(sc);}}
function payDone(r){const rc=store.get("receipts")||{};rc[st.order]={...r,at:Date.now()};store.set("receipts",rc);st.justPaid=true;unlockNow();}
// 토스 결제창에서 돌아왔을 때: 서버에서 결제 승인 후 열기
async function handlePayReturn(){const q=new URLSearchParams(location.search);
 if(q.get("r")){const r=q.get("r"),oid=q.get("oid")||"";history.replaceState(null,"",location.pathname+"#"+r);
  if(openFromHash()&&st.unlocked){const rc=store.get("receipts")||{};if(!rc[st.order])rc[st.order]={orderId:oid||st.order,method:"PAYAPP",amount:PAY.amount,at:Date.now()};store.set("receipts",rc);st.justPaid=true;renderReport();}
  else renderHome();return true;}
 if(!q.get("pay"))return false;
 const pend=store.get("pending");history.replaceState(null,"",location.pathname);
 if(!pend){renderHome();return true;}
 openPreview(pend.inp);
 if(q.get("pay")!=="ok"||q.get("orderId")!==pend.orderId){toast(q.get("message")||"결제가 완료되지 않았어요.");return true;}
 try{const r=await fetch(PAY.confirmUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentKey:q.get("paymentKey"),orderId:q.get("orderId"),amount:Number(q.get("amount"))})});
  const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||"승인 실패");
  store.set("pending",null);payDone({orderId:pend.orderId,method:pend.method,amount:PAY.amount});}
 catch(e){toast("결제 승인에 실패했어요. 결제된 금액은 자동 취소돼요.");}
 return true;}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500);}
function paidNote(){const rc=(store.get("receipts")||{})[st.order];if(!rc)return "";const L=linkFor(st.inp);
 return `<div class="paidnote">${st.justPaid?`<b>결제가 완료됐어요. 감사합니다!</b>`:`<b>결제 완료된 리포트</b>`}<span class="small">주문번호 ${esc(rc.orderId)} · ${PRICE}${rc.test?" · 테스트 결제":""}</span><span class="small">다른 휴대폰에서도 보려면 아래 링크를 저장해 두세요.</span><div class="order">${esc(L)}</div><button class="btn ghost" type="button" id="cpL">다시 보기 링크 복사</button></div>`;}
function wirePaid(){const b=$("#cpL");if(!b)return;b.onclick=()=>{try{navigator.clipboard.writeText(linkFor(st.inp)).then(()=>b.textContent="복사했어요",()=>b.textContent="링크를 길게 눌러 복사해 주세요");}catch(e){}};}
function unlockNow(){const o=store.get("opened")||[];if(!o.includes(st.order))o.push(st.order);store.set("opened",o);st.unlocked=true;st.pg=0;renderReport();scrollTo(0,0);}

// ---------- 열람 링크: #r-YYYYMMDD-HHMM-F-코드 (시 모름은 x) ----------
function linkFor(i){return `${APP_URL}#r-${i.y}${String(i.m).padStart(2,"0")}${String(i.d).padStart(2,"0")}-${i.hk?String(i.h).padStart(2,"0")+String(i.mi).padStart(2,"0"):"x"}-${i.g}-${codeFor(orderNo(i))}${i.name?"-"+[...new TextEncoder().encode(i.name)].map(b=>b.toString(16).padStart(2,"0")).join(""):""}`;}
function inpFrom(y,m,d,tm,g,name){return {name:name||"",y,m,d,...tm,g,corr:CORR};}
// 그로블 결제 후 받은 링크: #paid-123456 → 이 휴대폰에서 마지막으로 본 아이 리포트를 엽니다
function openFromPass(){const mt=/^#paid-(\d{6})$/.exec(location.hash);if(!mt)return false;
 if(mt[1]!==grobleCode()){renderHome();toast("링크가 올바르지 않아요.");return true;}
 const last=store.get("lastInp"),pf=store.get("payingFor");store.set("payingFor",null);
 if(last&&pf&&pf.o===orderNo(last)){openPreview(last);if(!st.unlocked)payDone({orderId:"GROBLE-"+st.order,method:"GROBLE",amount:PAY.amount});
  try{history.replaceState(null,"",location.pathname+"#"+linkFor(st.inp).split("#")[1]);}catch(e){}}
 else{store.set("passOK",true);renderHome();toast("결제가 확인됐어요. 아이 정보를 넣으면 전체 리포트가 열려요.");}
 return true;}
function openFromHash(){if(openFromPass())return true;const mt=/^#r-(\d{4})(\d{2})(\d{2})-(\d{4}|x)-([FM])-(\d{6})(?:-([0-9a-f]{2,48}))?$/.exec(location.hash);if(!mt)return false;
 const tm=mt[4]==="x"?{hk:false,h:12,mi:0}:{hk:true,h:+mt[4].slice(0,2),mi:+mt[4].slice(2)};if(tm.h>23||tm.mi>59)return false;
 const last=store.get("lastInp"),inp=inpFrom(+mt[1],+mt[2],+mt[3],tm,mt[5],mt[7]?(()=>{try{return new TextDecoder("utf-8",{fatal:true}).decode(new Uint8Array(mt[7].match(/../g).map(x=>parseInt(x,16)))).slice(0,8)}catch(e){return ""}})():"");
 if(!inp.name&&last&&orderNo(last)===orderNo(inp))inp.name=last.name||"";
 openPreview(inp);if(mt[6]===codeFor(st.order))unlockNow();return true;}

// ---------- 판매자 화면 ----------
function renderSeller(){
 st.pages=null;document.documentElement.classList.remove("paged","flow");$("#bar").hidden=true;scrollTo(0,0);
 $("#app").innerHTML=`
 <div class="hdr"><b>우리 아이 진로 사주</b><span>판매자 화면</span></div>
 <section class="card" style="display:grid;gap:14px;margin-top:10px">
  <h2>전체 리포트 링크 만들기</h2>
  <label class="f">판매자 비밀번호<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
  <label class="f">이름 (성 빼고, 선택)<input id="snick" maxlength="8" placeholder="예: 길동" autocomplete="off"></label>
  <label class="f">구매자 아이 생년월일 (양력)<input id="sbd" type="date" min="1990-01-01" max="2026-12-31"></label>
  <div class="f" style="display:grid;gap:6px;font-size:13px;color:var(--muted)">태어난 시간${timeSelects("s",null)}</div>
  <div class="f" style="display:grid;gap:6px;font-size:13px;color:var(--muted)">성별<div class="seg"><button type="button" id="sF" aria-pressed="true">여자아이</button><button type="button" id="sM" aria-pressed="false">남자아이</button></div></div>
  <label class="small" style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)"><input type="checkbox" id="paidOk" style="width:22px;height:22px"> ${PRICE} 결제를 확인했어요</label>
  <button class="btn" type="button" id="gen">보고서 링크 만들기</button>
  <button class="btn ghost" type="button" id="gbl">그로블에 넣을 전달 내용 보기</button>
  <p class="err" id="serr" hidden></p>
  <div id="out" hidden class="ok"></div>
  <p class="small">구매자가 보낸 캡처나 채팅 내용 그대로 생년월일·시·성별을 넣고, 당근페이 입금을 확인한 뒤 나온 문구를 채팅으로 보내 주세요. 링크와 코드는 그 아이 정보에만 맞습니다.</p>
 </section>${footer()}`;
 let g="F";const setG=v=>{g=v;$("#sF").setAttribute("aria-pressed",v==="F");$("#sM").setAttribute("aria-pressed",v==="M");};
 $("#sF").onclick=()=>setG("F");$("#sM").onclick=()=>setG("M");
 $("#gbl").onclick=()=>{const e=$("#serr");
  if(fnv("pin|"+$("#pin").value)!==SELLER_PIN_HASH){e.textContent="비밀번호가 맞지 않아요.";e.hidden=false;return;}
  e.hidden=true;const msg=`결제해 주셔서 감사합니다!\n아래 링크를 누르면 우리 아이 진로 리포트 전체가 바로 열려요.\n${APP_URL}#paid-${grobleCode()}\n(결제할 때 쓴 휴대폰에서 눌러 주세요)`;
  $("#out").hidden=false;$("#out").innerHTML=`<b>그로블 상품의 '구매 후 전달 내용'에 그대로 붙여 넣으세요</b><div class="order" style="margin-top:8px">${esc(msg)}</div><button class="btn" type="button" id="cpG" style="margin-top:8px">문구 복사</button>`;
  $("#cpG").onclick=()=>{try{navigator.clipboard.writeText(msg).then(()=>{$("#cpG").textContent="복사했어요";},()=>{$("#cpG").textContent="문구를 길게 눌러 복사해 주세요";});}catch(err){}};};
 $("#gen").onclick=()=>{const e=$("#serr"),bd=$("#sbd").value;
  if(fnv("pin|"+$("#pin").value)!==SELLER_PIN_HASH){e.textContent="비밀번호가 맞지 않아요.";e.hidden=false;return;}
  if(!$("#paidOk").checked){e.textContent="결제 확인에 먼저 체크해 주세요.";e.hidden=false;return;}
  if(!bd){e.textContent="생년월일을 넣어 주세요.";e.hidden=false;return;}
  e.hidden=true;const [y,m,d]=bd.split("-").map(Number),inp=inpFrom(y,m,d,readTime("s"),g,$("#snick").value.trim().slice(0,8));
  const link=linkFor(inp),c=codeFor(orderNo(inp));
  const msg=`입금 확인했습니다. 감사합니다!\n아래 링크를 누르시면 전체 리포트가 바로 열려요.\n${link}`;
  $("#out").innerHTML=`<b>${inp.name?esc(inp.name)+" · ":""}${y}년 ${m}월 ${d}일 · ${sjShort(inp)} · ${g==="M"?"남":"여"}</b><br><span class="small">주문번호 ${orderNo(inp)} · 열람 코드 ${c}</span><div class="order" style="margin-top:8px">${esc(msg)}</div><button class="btn" type="button" id="cp2" style="margin-top:8px">구매자에게 보낼 문구 복사</button><button class="btn ghost" type="button" id="view" style="margin-top:8px">전체 보고서 보기 · PDF 저장</button>`;$("#out").hidden=false;
  $("#view").onclick=()=>{openPreview(inp);unlockNow();};
  $("#cp2").onclick=()=>{try{navigator.clipboard.writeText(msg).then(()=>{$("#cp2").textContent="복사했어요";},()=>{$("#cp2").textContent="문구를 길게 눌러 복사해 주세요";});}catch(err){}};};
}

addEventListener("hashchange",()=>{if(location.hash==="#seller")renderSeller();else openFromHash();});
handlePayReturn().then(h=>{if(h)return;if(location.hash==="#seller")renderSeller();else if(openFromHash()){}else if(TEST_CHILD){renderHome();openPreview(TEST_CHILD);}else renderHome();});
</script>
